name: Build Links Plugin

# Builds plugins/Links (sokol_links) for every native backend on every change to the plugin, and commits
# the prebuilt outputs back to plugins/Links/libs/ on main — every shipped library is a CI build, never a
# local one. Windows and Linux have no native library (managed ShellExecute / xdg-open); the managed layer
# is compiled for every platform symbol set instead. A change is not done until every job is green.

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/Links/**'
      - '!plugins/Links/libs/**'
      - '.github/workflows/build-links-plugin.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'plugins/Links/**'
      - '!plugins/Links/libs/**'
      - '.github/workflows/build-links-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (arm64 + X64)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    - name: Build
      run: ./plugins/Links/scripts/build-macos.sh
    - uses: actions/upload-artifact@v4
      with:
        name: links-macos
        path: plugins/Links/libs/macos/**/*
        retention-days: 30

  build-ios:
    name: Build iOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [device, simulator-arm64, simulator-x64]
    steps:
    - uses: actions/checkout@v4
    - name: Setup CMake
      uses: lukka/get-cmake@latest
    - name: Build
      run: ./plugins/Links/scripts/build-ios.sh ${{ matrix.target }}
    - name: Determine upload path
      id: upload_path
      run: |
        case "${{ matrix.target }}" in
          device)          echo "path=plugins/Links/libs/ios/arm64" >> $GITHUB_OUTPUT ;;
          simulator-arm64) echo "path=plugins/Links/libs/ios/simulator-arm64" >> $GITHUB_OUTPUT ;;
          simulator-x64)   echo "path=plugins/Links/libs/ios/simulator-x64" >> $GITHUB_OUTPUT ;;
        esac
    - uses: actions/upload-artifact@v4
      with:
        name: links-ios-${{ matrix.target }}
        path: ${{ steps.upload_path.outputs.path }}/**/*
        retention-days: 30

  build-android:
    name: Build Android (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''
    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;27.2.12479018"
        echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
    - name: Build
      run: ./plugins/Links/scripts/build-android.sh
    - uses: actions/upload-artifact@v4
      with:
        name: links-android
        path: plugins/Links/libs/android/**/*
        retention-days: 30

  build-web:
    name: Build Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: '3.1.56'
    - name: Build
      run: ./plugins/Links/scripts/build-web.sh Release
    - uses: actions/upload-artifact@v4
      with:
        name: links-emscripten
        path: plugins/Links/libs/emscripten/**/*
        retention-days: 30

  build-managed:
    name: Managed layer (Windows + Linux backends, every platform symbol set)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Compile the managed layer for every platform symbol set
      run: |
        set -e
        mkdir -p /tmp/links-managed && cd /tmp/links-managed
        cat > links.csproj <<'PROJ'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net10.0</TargetFramework>
            <Nullable>enable</Nullable>
            <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            <DefineConstants>$(DefineConstants);$(LinksSymbols)</DefineConstants>
          </PropertyGroup>
          <ItemGroup>
            <Compile Include="$(GITHUB_WORKSPACE)/plugins/Links/managed/*.cs" />
          </ItemGroup>
        </Project>
        PROJ
        for SYMS in "" "__LINUX__" "__WINDOWS__" "__MACOS__" "__ANDROID__" "__IOS__" "WEB"; do
          echo "=== DefineConstants: '${SYMS:-<none>}'"
          dotnet build -c Release -p:LinksSymbols="$SYMS" --nologo -v q
        done

  commit-libs:
    name: Commit the Android, iOS, macOS and Web libraries
    needs: [build-macos, build-ios, build-android, build-web, build-managed]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
    - name: Download the artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Commit the libraries
      run: |
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
        cd repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        mkdir -p plugins/Links/libs/android plugins/Links/libs/macos plugins/Links/libs/emscripten \
                 plugins/Links/libs/ios/arm64 plugins/Links/libs/ios/simulator-arm64 plugins/Links/libs/ios/simulator-x64
        cp -r ../artifacts/links-android/*              plugins/Links/libs/android/
        cp -r ../artifacts/links-macos/*                plugins/Links/libs/macos/
        cp -r ../artifacts/links-emscripten/*           plugins/Links/libs/emscripten/
        cp -r ../artifacts/links-ios-device/*           plugins/Links/libs/ios/arm64/
        cp -r ../artifacts/links-ios-simulator-arm64/*  plugins/Links/libs/ios/simulator-arm64/
        cp -r ../artifacts/links-ios-simulator-x64/*    plugins/Links/libs/ios/simulator-x64/
        LIBS="plugins/Links/libs"
        if [ -z "$(git status --porcelain $LIBS)" ]; then
          echo "No sokol_links library change to commit"
          exit 0
        fi
        git add $LIBS
        git commit -m "Auto-update built sokol_links libraries (Android, iOS, macOS, Web) [skip ci]" \
                   -m "Generated from commit: ${{ github.sha }}" \
                   -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        git pull --rebase origin main
        git push origin main
        echo "✓ Committed sokol_links libraries"
